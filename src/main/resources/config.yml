# WildStore - settings
# Every chat text is in lang.yml. Apply changes with /wildstore reload.

store:
  # Shown by /store and in the purchase announcement
  link: "https://store.example.net"
  # Aliases of /store, need a restart
  aliases: [shop, online-shop]

purchase:
  # Seconds to wait for more /storepurchase of the same player,
  # so a purchase of several products is announced only once
  debounce: 2
  # The player's head as pixels next to the announcement
  head: true
  # 8x8 head image, {player} = name
  head-url: "https://minotar.net/helm/{player}/8.png"
  # Sound for everyone online, "" = none
  sound: entity.player.levelup
  volume: 1.0
  pitch: 1.0

gg-wave:
  enabled: true
  # Seconds after an announcement in which a GG counts
  seconds: 15
  # Words that count as GG, not case sensitive
  keywords: [gg, ggs, "good game"]
  # The buyer gets a reward for their own GG
  reward-buyer: false
  # Console commands for every player who writes GG, {player} = player, {buyer} = buyer
  # Example: "give {player} minecraft:diamond 1"
  commands: []
  # Sound for the player who gets the reward, "" = none
  sound: entity.experience_orb.pickup
